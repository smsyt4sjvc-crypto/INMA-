name: probe ICE CDS settlement prices

# ONE-OFF INVESTIGATION, not part of the daily job.
#
# ICE Clear Credit publishes daily 5Y single-name CDS settlement prices free at
#   https://www.ice.com/cds-settlement-prices/icc/single-name-instruments
# That is the single most valuable gap in the fragility ladder: single-name CDS
# is where AI-complex stress shows up FIRST, and it has no other free source.
#
# The page renders its table client-side, so curl gets an empty shell. The agent
# container cannot drive Chromium (the egress proxy resets the connection), but a
# GitHub runner has clean outbound network -- the same reason FRED works here.
#
# This job answers the two questions that decide whether the panel is buildable:
#   1. What request actually serves the data? (a JSON/CSV endpoint we could call
#      directly with curl would be far better than scraping a rendered table)
#   2. Are the seven names in the thesis actually CLEARED through ICC? Coverage
#      is the real catch -- only cleared names appear.
#
# Everything is written to an artifact. Nothing is committed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Probe ICE
        run: |
          cat > probe.py <<'PYEOF'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          URL = "https://www.ice.com/cds-settlement-prices/icc/single-name-instruments"
          # The seven the AI-debt thesis actually needs, plus the neocloud and the
          # names the vault already tracks by chart.
          WANT = ["BROADCOM", "AVGO", "NVIDIA", "NVDA", "ORACLE", "ORCL",
                  "META", "PLATFORMS", "ALPHABET", "GOOGLE", "GOOGL",
                  "AMAZON", "AMZN", "MICROSOFT", "MSFT", "COREWEAVE", "CRWV"]
          out = {}

          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page()
                  calls = []
                  pg.on("response", lambda r: calls.append(
                      (r.status, r.request.method, r.url,
                       r.headers.get("content-type", "")))
                      if r.request.resource_type in ("xhr", "fetch") else None)

                  r = await pg.goto(URL, wait_until="networkidle", timeout=120000)
                  out["status"] = r.status if r else None
                  await pg.wait_for_timeout(6000)

                  out["xhr"] = [
                      {"status": s, "method": m, "url": u[:400], "ctype": c}
                      for s, m, u, c in calls]

                  # tables as rendered
                  tables = await pg.eval_on_selector_all(
                      "table", "els => els.map(e => e.innerText)")
                  out["table_count"] = len(tables)
                  out["tables_preview"] = [t[:4000] for t in tables[:3]]

                  body = await pg.inner_text("body")
                  out["body_len"] = len(body)
                  out["body_preview"] = body[:2500]

                  up = body.upper()
                  out["name_hits"] = {w: up.count(w) for w in WANT if w in up}

                  # any download links on the page
                  hrefs = await pg.eval_on_selector_all(
                      "a[href]", "els => els.map(e => e.href)")
                  out["download_links"] = sorted({
                      h for h in hrefs
                      if re.search(r"\.(csv|xls[xm]?|zip|txt|json)(\?|$)", h, re.I)})

                  await b.close()

          asyncio.run(main())
          print(json.dumps(out, indent=1)[:20000])
          open("ice_probe.json", "w").write(json.dumps(out, indent=1))
          PYEOF
          python probe.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ice-probe
          path: ice_probe.json
